<h2 class="modal-title">Registrar nuevo usuario</h2>

<form [formGroup]="registerForm" class="register-form">
  <div class="field" [class.field--invalid]="!!usernameError">
    <label for="username">Usuario</label>
    <input id="username" type="text" formControlName="username" />
  </div>

  <div class="field" [class.field--invalid]="!!emailError">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" />
  </div>

  <div class="field" [class.field--invalid]="!!passwordError">
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" />
  </div>
</form>

<div class="actions">
  <button class="btn ghost" (click)="onCancel()">Cancelar</button>
  <button class="btn primary" (click)="onSubmit()">Registrar</button>
</div>
