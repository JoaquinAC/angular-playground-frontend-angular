<h2 class="observables-title">
  🔎 Flujo Reactivo en Tiempo Real
</h2>

<button
  class="observables-close btn ghost"
  (click)="close()"
  aria-label="Cerrar modal"
>
  ✕
</button>

<!-- Estado actual -->
<section class="status-box">
  <span class="badge active">● ACTIVO</span>
  <span class="source">Fuente: Subjects</span>

  <pre class="state">
{{ activeUser | json }}
  </pre>
</section>

<!-- Línea de tiempo -->
<section class="timeline">
  <div
    *ngFor="let step of timeline"
    class="timeline-node"
    [class.active]="step.active"
  >
    <span>{{ step.label }}</span>
  </div>
</section>

<!-- Log reactivo -->
<section class="log-box">
  <h3>📜 Log reactivo</h3>

  <ul>
    <li *ngFor="let log of logs">
      [{{ log.time }}] {{ log.message }}
    </li>
  </ul>
</section>
